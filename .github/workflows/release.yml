name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli@2 build --bundles nsis *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 150
          exit $code

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item src-tauri/target/release/luma.exe dist/Luma.exe
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile dist/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist/ffmpeg.exe
          Compress-Archive -Path dist/* -DestinationPath Luma-portable-win64.zip
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName Luma-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: luma-win64
          path: |
            Luma-Setup.exe
            Luma-portable-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" Luma-Setup.exe Luma-portable-win64.zip --title "Luma ${{ github.ref_name }}" --notes-file .github/release-notes.md

      - name: Save log on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) { Get-Content build.log -Tail 250 | Set-Content ci-log.txt } else { "no build.log" | Set-Content ci-log.txt }
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs
          git rm -rf --cached . -q
          git add -f ci-log.txt
          git commit -m "build log" -q
          git push -f origin ci-logs
