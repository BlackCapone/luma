<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luma</title>
<style>
@property --accent{syntax:'<color>';inherits:true;initial-value:#ff9a76}
:root{--bg:#0d0c11;--text:#f6f3fa;--mute:#9d97ab;--hov:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);--onacc:#1a0f0c;transition:--accent 1.2s ease}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.4 Onest,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
.app{position:relative;display:grid;grid-template-columns:88px minmax(0,1fr);height:100%;overflow:hidden}
.amb{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 85% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%),radial-gradient(50% 45% at 0% 100%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%)}
body.no-glow .amb{display:none}
.rail{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 0;border-right:1px solid var(--line)}
.logo{margin-bottom:18px}
.nav{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--mute)}
.nav svg{width:22px;height:22px}.nav:hover{color:var(--text)}
.nav.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
main{position:relative;overflow:auto;min-width:0}
.top{position:sticky;top:0;z-index:3;display:flex;flex-direction:column;gap:18px;padding:36px 56px 14px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);background:rgba(13,12,17,.4)}
.sb{display:flex;align-items:center;gap:14px;max-width:680px;height:60px;padding:0 24px;border-radius:30px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--mute)}
.sb:focus-within{border-color:var(--accent);color:var(--text)}.sb svg{width:22px;height:22px;flex:none}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:500 18px Onest,"Segoe UI",system-ui,sans-serif;user-select:text}
#q::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.07);font-weight:600;font-size:14px}
.chip:hover{background:rgba(255,255,255,.14)}.chip.on{background:var(--text);color:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%}
.body{position:relative;padding:8px 56px 150px}
h1{font-size:30px;letter-spacing:-.03em;margin:8px 0 14px}
#empty,.hint{color:var(--mute)}.hint{font-size:13px;margin-bottom:6px}
#cols{display:grid;grid-template-columns:minmax(0,1fr);gap:44px}#cols.hh{grid-template-columns:400px minmax(0,1fr)}
.lab{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--mute)}
.hc{padding:28px;border-radius:28px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent) 8%,transparent) 60%,rgba(255,255,255,.03));border:1px solid var(--line)}
.hcv{width:200px;height:200px;border-radius:22px;box-shadow:0 -20px 60px -16px color-mix(in srgb,var(--accent) 55%,transparent),0 24px 60px -16px color-mix(in srgb,var(--accent) 50%,transparent)}
.ht{margin-top:26px;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.ha{margin-top:6px;font-size:17px;color:var(--mute)}
.hb{display:flex;align-items:center;gap:14px;margin-top:22px}
.hp{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--onacc);display:grid;place-items:center}.hp svg{width:24px;height:24px;fill:currentColor}
.hs,.chk{padding:12px 20px;border-radius:99px;background:rgba(255,255,255,.08);font-weight:600;font-size:15px}.hs:hover{background:rgba(255,255,255,.14)}.chk{color:var(--mute)}
.cv{position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 45% 30%),hsl(calc(var(--h) + 50) 50% 18%))}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mt{min-width:0}.mt b,.mt i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt b{font-weight:600;font-size:16px}.mt i{font-style:normal;color:var(--mute);font-size:14px}
.on .mt b{color:var(--accent)}
.it{position:relative;cursor:pointer;min-width:0}
#grid.list .it{display:grid;grid-template-columns:48px minmax(0,1fr) auto 20px 44px 36px;align-items:center;gap:16px;padding:8px 14px;border-radius:16px}
#grid.list .it:hover{background:var(--hov)}#grid.list .it.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
#grid.list .cv{width:48px;height:48px;border-radius:10px}
#grid.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
#grid.tiles .it{padding:12px;border-radius:16px;background:rgba(255,255,255,.04)}#grid.tiles .it:hover{background:var(--hov)}
#grid.tiles .cv{aspect-ratio:1;border-radius:12px;margin-bottom:10px}
#grid.tiles .src,#grid.tiles .du{display:none}
#grid.tiles .st{position:absolute;top:20px;left:20px;background:rgba(0,0,0,.65);padding:2px 9px;border-radius:99px;font-weight:600}
.src{justify-self:start;padding:3px 10px;border:1px solid rgba(255,255,255,.12);border-radius:99px;font-size:12px;font-weight:600;color:var(--mute)}
.src:empty,.st:empty{visibility:hidden}.st{font-size:12px;color:var(--mute)}.st svg{width:16px;height:16px}
body.no-badge .st{display:none}
.du{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);opacity:0;transition:opacity .15s}
.pl svg{width:22px;height:22px;fill:#fff}.it:hover .pl{opacity:1}
.it.busy .cv{animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.5}}
.del{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mute);opacity:0;transition:opacity .15s,background .15s}
.del svg{width:17px;height:17px}.it:hover .del,.del.ask{opacity:1}
.del:hover{color:#fff;background:rgba(255,255,255,.12)}.del.ask{background:#e5484d;color:#fff}
#grid.tiles .del{position:absolute;top:18px;right:18px;background:rgba(0,0,0,.6)}
body.no-anim *{transition:none!important;animation:none!important}
/* плавающая панель плеера */
.dock{position:absolute;left:calc(50% + 44px);bottom:28px;transform:translateX(-50%);z-index:10;width:min(1000px,calc(100% - 200px));height:88px;display:grid;grid-template-columns:250px minmax(0,1fr) 170px;align-items:center;gap:20px;padding:0 26px 0 16px;border-radius:30px;background:rgba(30,26,36,.78);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 90px color-mix(in srgb,var(--accent) 14%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.np{display:flex;gap:14px;align-items:center;min-width:0;cursor:pointer}
#np-img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.08);flex:none}
#np-img:not([src]){visibility:hidden}
.np .mt b{font-size:15px}.np .mt b:hover{text-decoration:underline}.np .mt i{font-size:13px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cb{display:flex;align-items:center;gap:20px}
.ic{position:relative;width:32px;height:32px;display:grid;place-items:center;color:var(--mute)}
.ic:hover{color:var(--text)}.ic.on{color:var(--accent)}.ic svg{width:18px;height:18px}
.ic.fill{color:var(--text)}.ic.fill svg{fill:currentColor;stroke:none}
.one::after{content:"1";position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800}
#pp{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--onacc);display:grid;place-items:center}
#pp:hover{transform:scale(1.06)}#pp svg{width:20px;height:20px;fill:currentColor}
.time{display:flex;align-items:center;gap:10px;width:100%;max-width:440px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.time span{width:34px}#cur{text-align:right}
.sl{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;outline:0;cursor:pointer;background:linear-gradient(90deg,var(--f,#fff) var(--p,0%),rgba(255,255,255,.22) 0)}
.sl:hover{--f:var(--accent)}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}.sl:hover::-webkit-slider-thumb{opacity:1}
#wave{flex:1;min-width:0;height:24px;cursor:pointer}
body:not(.wb) #wave{display:none}body.wb #seek{display:none}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:8px}.vol .sl{flex:none;width:72px}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:60;background:#2a2433;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:70vw}
#toast.show{opacity:1}
/* настройки */
#settings{max-width:680px}#settings h1{margin-bottom:6px}
#settings h2{font-size:14px;font-weight:600;margin:26px 0 6px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row input[type=checkbox]{appearance:none;flex:none;width:42px;height:24px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:background .2s}
.row input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.row input[type=checkbox]:checked{background:var(--accent)}.row input[type=checkbox]:checked::after{transform:translateX(18px)}
select,.tx{background:rgba(255,255,255,.1);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;user-select:text}
.tx{width:260px}select option{background:#221d2b}
.btn{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.1);font-weight:600}.btn:hover{background:rgba(255,255,255,.18)}
/* Сейчас играет */
#fs{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:72px;padding:0 112px;overflow:hidden;background:var(--bg);animation:fsin .35s ease}
@keyframes fsin{from{opacity:0;transform:scale(1.03)}}
#fs-bg{position:absolute;inset:-10%;z-index:-1;background:var(--fbg,none) center/cover;filter:blur(90px) brightness(.55) saturate(1.5)}
#fs::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:rgba(13,12,17,.42)}
#fs-img{justify-self:end;width:min(480px,100%);aspect-ratio:1;border-radius:36px;object-fit:cover;background:rgba(255,255,255,.08);transition:box-shadow .9s ease;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 -44px 120px -24px var(--gt,transparent),0 44px 120px -24px var(--gb,transparent),-44px 0 120px -34px var(--gl,transparent),44px 0 120px -34px var(--gr,transparent)}
#fs-img:not([src]){visibility:hidden}
.fs-r{display:flex;flex-direction:column;gap:22px;max-width:600px;min-width:0}
#fs .lab{margin:0;color:rgba(255,255,255,.7)}
#fs-t{margin:0;font-size:clamp(36px,6.4vh,68px);font-weight:700;letter-spacing:-.035em;line-height:1.02}
#fs-a{margin-top:10px;font-size:24px;color:rgba(255,255,255,.75)}
#fs-chips{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.12);font-size:13px;font-weight:600}.pill svg{width:14px;height:14px}
#fwave{display:block;width:100%;height:96px;cursor:pointer}
.fs-time{display:flex;justify-content:space-between;margin-top:4px;font-size:14px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.fsc{display:flex;align-items:center;gap:30px}
.fsc button{position:relative;display:grid;place-items:center}
.fsc .fsm{color:rgba(255,255,255,.7)}.fsc .fsm.on{color:var(--accent)}.fsc .fsm:hover{color:#fff}
.fsc svg.s{width:26px;height:26px}.fsc .f svg{width:34px;height:34px;fill:currentColor;stroke:none}
.fsm.one::after{font-size:11px}
#fs-pp{width:84px;height:84px;border-radius:50%;background:#fff;color:#1a0f0c}#fs-pp svg{width:34px;height:34px;fill:currentColor}
#fs-q{display:flex;flex-direction:column;gap:12px}#fs-q:empty{display:none}
.qi{display:flex;align-items:center;gap:14px;cursor:pointer}.qi .cv{width:44px;height:44px;border-radius:10px;flex:none}.qi .mt{flex:1}.qi .mt b{font-size:15px}.qi .mt i{color:rgba(255,255,255,.62);font-size:13px}.qi .du{color:rgba(255,255,255,.62);font-size:13px}
#fs-x{position:absolute;top:32px;left:32px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
@media (max-height:780px){#fs-q{display:none}}
@media (max-width:1100px){#cols.hh{grid-template-columns:1fr}.dock{grid-template-columns:200px minmax(0,1fr) 110px;width:calc(100% - 120px)}.vol .sl{display:none}#fs{grid-template-columns:1fr;padding:0 40px;gap:24px}#fs-img{justify-self:center;width:min(300px,50vh)}}
</style>
</head>
<body>
<div class="app">
  <div class="amb"></div>
  <nav class="rail" aria-label="Разделы">
    <svg class="logo" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M10 8v8l6-4z" fill="#fff"/></svg>
    <button class="nav on" data-v="search" aria-label="Поиск" title="Поиск"><svg class="s" viewBox="0 0 24 24"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-4.3-4.3"/></svg></button>
    <button class="nav" data-v="lib" aria-label="Библиотека" title="Библиотека"><svg class="s" viewBox="0 0 24 24"><path d="M5 3v18M10 3v18M15 5l5 15"/></svg></button>
    <button class="nav" data-v="set" aria-label="Настройки" title="Настройки"><svg class="s" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5a2 2 0 100 4 2 2 0 000-4zM9 15a2 2 0 100 4 2 2 0 000-4z"/></svg></button>
  </nav>
  <main>
    <div class="top" id="top">
      <label class="sb"><svg class="s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Что хотите послушать?" autofocus></label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="body">
      <h1 id="title"></h1><p id="empty"></p>
      <div id="cols"><section id="hero" hidden></section><section><h2 class="lab" id="lab">Треки</h2><div id="grid" class="list"></div></section></div>
      <div id="settings" hidden></div>
    </div>
  </main>
  <footer class="dock">
    <div class="np" id="npb" title="Открыть «Сейчас играет»"><img id="np-img" alt=""><div class="mt"><b id="np-t">Ничего не играет</b><i id="np-a">Выберите трек</i></div></div>
    <div class="ctl">
      <div class="cb">
        <button class="ic" id="shuf" aria-label="Перемешать"><svg class="s" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="ic fill" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="pp" aria-label="Играть"></button>
        <button class="ic fill" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="ic" id="rep" aria-label="Повтор"><svg class="s" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg></button>
      </div>
      <div class="time"><span id="cur">0:00</span><input id="seek" class="sl" type="range" min="0" max="1000" value="0"><canvas id="wave"></canvas><span id="dur">0:00</span></div>
    </div>
    <div class="vol">
      <button class="ic" id="fsb" aria-label="Сейчас играет"><svg class="s" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ic" id="mute" aria-label="Громкость"><svg class="s" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 010 7M19 5a9 9 0 010 14"/></svg></button>
      <input id="vol" class="sl" type="range" min="0" max="100" value="80">
    </div>
  </footer>
</div>
<section id="fs" hidden>
  <div id="fs-bg"></div>
  <button id="fs-x" aria-label="Закрыть"><svg class="s" width="22" height="22" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <img id="fs-img" alt="">
  <div class="fs-r">
    <div class="lab">Сейчас играет</div>
    <div><h1 id="fs-t"></h1><div id="fs-a"></div></div>
    <div id="fs-chips"></div>
    <div><canvas id="fwave"></canvas><div class="fs-time"><span id="fs-c">0:00</span><span id="fs-d">0:00</span></div></div>
    <div class="fsc">
      <button class="fsm" id="fs-shuf" aria-label="Перемешать"><svg class="s" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="f" id="fs-prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="fs-pp" aria-label="Играть"></button>
      <button class="f" id="fs-next" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button class="fsm" id="fs-rep" aria-label="Повтор"><svg class="s" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg></button>
    </div>
    <div id="fs-q"></div>
  </div>
</section>
<div id="toast"></div>
<script>
const {invoke,convertFileSrc}=window.__TAURI__.core;
const {emit,listen}=window.__TAURI__.event;
const win=window.__TAURI__.window.getCurrentWindow();
const $=s=>document.querySelector(s);
const audio=new Audio();
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const SRC={ytm:'YT Music',yt:'YouTube',sc:'SoundCloud',sp:'Spotify'};
const CHIPS=[['all','Все'],['ytm','YouTube Music'],['yt','YouTube'],['sc','SoundCloud'],['sp','Spotify']];
const DEF={dyn:true,glow:true,anim:true,badges:true,layout:'list',dockWave:true,keys:true,count:20,
  srcytm:true,srcsc:true,srcyt:false,srcsp:true,spId:'',spSecret:'',fsReal:false,fsGlow:true,fsGlowPower:2,
  ov:false,ovOnlyPlay:false,ovLevel:'desk',ovGrid:true,ovAvoid:true,ovCover:true,ovTime:true,ovVol:true,ovMin:true,ovScale:100,ovOpacity:100,ovX:null,ovY:null};
let S={...DEF,...JSON.parse(localStorage.getItem('luma')||localStorage.getItem('volna')||'{}')};
const save=()=>localStorage.setItem('luma',JSON.stringify(S));
let view='search',src='all',results=[],lib=[],queue=[],qi=-1,now=null,busy=new Set(),searching=false,shuf=false,rep=0,seeking=false,lastV=.8;
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cover=t=>t.local_cover?convertFileSrc(t.local_cover):(t.cover||'');
const hue=id=>[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
const isLocal=t=>lib.some(l=>l.id===t.id);
const list=()=>view==='search'?results:lib;
const img=t=>cover(t)?`<img src="${esc(cover(t))}" loading="lazy" onerror="this.remove()">`:'';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3800)}

/* ---------- отрисовка ---------- */
const TRASH='<svg class="s" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const delBtn=t=>isLocal(t)?`<button class="del${ask===t.id?' ask':''}" data-id="${t.id}" title="Удалить из библиотеки">${TRASH}</button>`:'<span></span>';
const CHK='<svg class="s" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
const DOT={ytm:'#ff5a5f',yt:'#f2b84b',sc:'#ff8a3d',sp:'#3ddc84'};
function row(t,i){
  const b=busy.has(t.id);
  return `<div class="it${b?' busy':''}${now&&now.id===t.id?' on':''}" data-i="${i}"><div class="cv" style="--h:${hue(t.id)}">${img(t)}<span class="pl">${PLAY}</span></div><div class="mt"><b>${esc(t.title)}</b><i>${esc(t.artist)}</i></div><span class="src">${SRC[t.source]||''}</span><span class="st">${isLocal(t)?CHK:b?'Скачиваю…':''}</span><span class="du">${t.duration?fmt(t.duration):''}</span>${delBtn(t)}</div>`;
}
const heroHTML=t=>`<h2 class="lab">Лучшее совпадение</h2><div class="hc"><div class="hcv cv" style="--h:${hue(t.id)}">${img(t)}</div><div class="ht">${esc(t.title)}</div><div class="ha">${esc(t.artist)}${t.duration?' · '+fmt(t.duration):''}</div><div class="hb"><button class="hp" data-act="play" aria-label="Играть">${PLAY}</button>${isLocal(t)?'<span class="chk">Скачан</span>':`<button class="hs" data-act="dl">${busy.has(t.id)?'Скачиваю…':'Скачать'}</button>`}</div></div>`;
async function dl(t){
  if(isLocal(t)||busy.has(t.id))return;
  busy.add(t.id);render();
  try{const tr=await invoke('download',{track:t});lib.unshift(tr);toast('Трек скачан')}
  catch(e){toast('Не удалось скачать: '+e)}
  finally{busy.delete(t.id);render()}
}
$('#hero').onclick=e=>{const b=e.target.closest('[data-act]');if(!b||!results.length)return;b.dataset.act==='play'?play(results[0],results):dl(results[0])};
function render(){
  const st=view==='set',l=st?[]:list(),hero=view==='search'&&l.length?l[0]:null;
  $('#settings').hidden=!st;$('#cols').hidden=st;$('#empty').hidden=st;$('#top').hidden=view!=='search';$('#title').hidden=st||!!hero;
  $('#chips').innerHTML=CHIPS.map(([k,n])=>`<button class="chip${k===src?' on':''}" data-s="${k}">${DOT[k]?`<span class="dot" style="background:${DOT[k]}"></span>`:''}${n}</button>`).join('');
  if(st){renderSet();return}
  $('#title').textContent=view==='lib'?'Библиотека':searching?'Ищу…':'Найдите музыку';
  $('#empty').textContent=l.length||searching?'':view==='lib'?'Скачанные треки появятся здесь.':'Введите запрос и нажмите Enter. Источник выбирается под строкой поиска.';
  $('#hero').hidden=!hero;if(hero)$('#hero').innerHTML=heroHTML(hero);
  $('#cols').className=hero?'hh':'';$('#lab').hidden=!hero;
  $('#grid').className=S.layout==='tiles'?'tiles':'list';
  $('#grid').innerHTML=l.map(row).join('');
}
function accent(s){
  if(!s||!S.dyn)return;
  const i=new Image();i.crossOrigin='anonymous';
  i.onload=()=>{try{
    const c=document.createElement('canvas');c.width=c.height=10;
    const x=c.getContext('2d');x.drawImage(i,0,0,10,10);
    const d=x.getImageData(0,0,10,10).data;let r=0,g=0,b=0,n=0;
    for(let k=0;k<d.length;k+=4){const mx=Math.max(d[k],d[k+1],d[k+2]),mn=Math.min(d[k],d[k+1],d[k+2]);if(mx-mn<35||mx<60)continue;r+=d[k];g+=d[k+1];b+=d[k+2];n++}
    if(!n)return;r/=n;g/=n;b/=n;const k=210/Math.max(r,g,b);
    const R=Math.min(255,r*k)|0,G=Math.min(255,g*k)|0,B=Math.min(255,b*k)|0,st=document.documentElement.style;
    st.setProperty('--accent',`rgb(${R},${G},${B})`);
    st.setProperty('--onacc',.299*R+.587*G+.114*B>150?'#1a0f0c':'#fff');
  }catch{}};
  i.src=s;
}

/* ---------- воспроизведение ---------- */
async function play(t,l){
  queue=l;qi=l.findIndex(x=>x.id===t.id);
  let tr=lib.find(x=>x.id===t.id);
  if(!tr){
    if(busy.has(t.id))return;
    busy.add(t.id);render();
    try{tr=await invoke('download',{track:t});lib.unshift(tr)}
    catch(e){toast('Не удалось скачать: '+e);return}
    finally{busy.delete(t.id);render()}
  }
  now=tr;audio.src=convertFileSrc(tr.file);audio.play();
  $('#np-t').textContent=tr.title;$('#np-a').textContent=tr.artist;
  const c=cover(tr);c?$('#np-img').src=c:$('#np-img').removeAttribute('src');
  accent(c);loadWave(tr);fsUpdate();render();
}
function step(d){
  if(!queue.length)return;
  let i;
  if(d>0){i=shuf?Math.floor(Math.random()*queue.length):qi+1;if(i>=queue.length){if(rep===1)i=0;else return}}
  else{if(audio.currentTime>3){audio.currentTime=0;return}i=qi-1;if(i<0)return}
  play(queue[i],queue);
}
async function doSearch(q){
  if(src==='sp'&&!S.spId)return toast('Добавьте ключи Spotify в настройках');
  searching=true;results=[];render();
  const enabled=['ytm','sc','yt','sp'].filter(k=>S['src'+k]);
  try{results=await invoke('search',{query:q,count:S.count,source:src,spId:S.spId,spSecret:S.spSecret,enabled});if(!results.length)toast('Ничего не найдено')}
  catch(e){toast(String(e))}
  searching=false;render();
}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){view='search';setNav();doSearch(e.target.value.trim())}});
$('#chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;src=c.dataset.s;render();const q=$('#q').value.trim();if(q)doSearch(q)};
$('#grid').onclick=e=>{const d=e.target.closest('.del');if(d)return askDel(d.dataset.id);const c=e.target.closest('.it');if(c)play(list()[c.dataset.i],list())};
function setNav(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===view));render()}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{view=n.dataset.v;setNav()});

/* ---------- нижняя панель ---------- */
const setP=(el,p)=>el.style.setProperty('--p',p+'%');
$('#pp').innerHTML=PLAY;
$('#pp').onclick=()=>{if(audio.src)audio.paused?audio.play():audio.pause()};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#shuf').onclick=$('#fs-shuf').onclick=()=>{shuf=!shuf;syncModes()};
$('#rep').onclick=$('#fs-rep').onclick=()=>{rep=(rep+1)%3;syncModes()};
audio.onplay=()=>$('#pp').innerHTML=PAUSE;
audio.onpause=()=>$('#pp').innerHTML=PLAY;
audio.onended=()=>{if(rep===2){audio.currentTime=0;audio.play()}else step(1)};
audio.ontimeupdate=()=>{
  const d=audio.duration||0,p=d?audio.currentTime/d*100:0;
  if(!seeking){$('#seek').value=p*10;setP($('#seek'),p)}
  $('#cur').textContent=fmt(audio.currentTime);$('#dur').textContent=fmt(d);
  $('#fs-c').textContent=fmt(audio.currentTime);$('#fs-d').textContent=fmt(d);
  drawWave();
};
$('#seek').oninput=e=>{seeking=true;setP(e.target,e.target.value/10);if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration};
$('#seek').onchange=()=>seeking=false;
audio.addEventListener('volumechange',()=>{const v=audio.volume*100;$('#vol').value=v;setP($('#vol'),v)});
$('#vol').oninput=e=>audio.volume=e.target.value/100;
$('#mute').onclick=()=>{if(audio.volume>0){lastV=audio.volume;audio.volume=0}else audio.volume=lastV||.8};
audio.volume=.8;
document.addEventListener('keydown',e=>{if(S.keys&&e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(e.target.tagName)){e.preventDefault();$('#pp').click()}});

/* ---------- настройки ---------- */
const GROUPS=[
 ['Оформление',[['layout','Вид результатов',[['list','Список'],['tiles','Плитки']]],['dyn','Цвета из обложки трека'],['glow','Цветное свечение фона окна'],['anim','Анимации'],['badges','Статус «Скачан»'],['dockWave','Волна трека в нижней панели']]],
 ['Поиск',[['srcytm','Искать в YouTube Music'],['srcsc','Искать в SoundCloud'],['srcyt','Искать в YouTube'],['srcsp','Искать в Spotify'],['count','Результатов с источника',[[10,'10'],[20,'20'],[40,'40']]]],'Эти источники используются во вкладке «Все». Один источник можно выбрать под строкой поиска.'],
 ['Spotify',[['spId','Client ID',null,'text'],['spSecret','Client Secret',null,'password']],'Аудио Spotify защищено, поэтому Luma берёт каталог Spotify (не больше 10 результатов), а сам трек находит и скачивает на YouTube Music. Нужны ключи приложения с developer.spotify.com/dashboard.'],
 ['Приложение',[['keys','Пробел ставит на паузу'],['fsReal','Полный экран окна в «Сейчас играет»'],['fsGlow','Свечение от обложки в «Сейчас играет»'],['fsGlowPower','Сила свечения',[[1,'Слабое'],[2,'Среднее'],[3,'Сильное']]]]],
 ['Виджет на рабочем столе',[['ov','Показывать виджет на рабочем столе'],['ovOnlyPlay','Только пока играет музыка'],['ovLevel','Где показывать виджет',[['desk','Только над рабочим столом'],['top','Поверх всех окон']]],['ovGrid','Сетка и привязка при выборе места'],['ovAvoid','Не ставить виджет на ярлыки'],['ovCover','Обложка'],['ovTime','Прогресс и время'],['ovVol','Громкость'],['ovMin','Сворачивать главное окно при выборе места'],['ovScale','Размер виджета',[[80,'Маленький'],[100,'Обычный'],[125,'Большой']]],['ovOpacity','Прозрачность виджета',[[100,'Нет'],[85,'Лёгкая'],[70,'Сильная']]]]]];
function renderSet(){
  $('#settings').innerHTML='<h1>Настройки</h1>'+GROUPS.map(([g,it,note])=>`<h2>${g}</h2>${note?`<p class="hint">${note}</p>`:''}`+it.map(([k,l,o,ty])=>
    `<label class="row"><span>${l}</span>${o?`<select data-k="${k}">${o.map(([v,n])=>`<option value="${v}"${S[k]==v?' selected':''}>${n}</option>`).join('')}</select>`:ty?`<input class="tx" type="${ty}" data-k="${k}" value="${esc(S[k])}" placeholder="не задано">`:`<input type="checkbox" data-k="${k}"${S[k]?' checked':''}>`}</label>`).join('')).join('')
    +'<div class="row" style="cursor:default"><span>Положение виджета</span><span><button class="btn" id="place">Выбрать место</button> <button class="btn" id="reset">Сбросить</button></span></div><h2>Библиотека</h2><div class="row" style="cursor:default"><span>Скачано треков: '+lib.length+'</span><button class="btn" id="clr">Очистить библиотеку</button></div>';
}
$('#settings').onchange=e=>{const k=e.target.dataset.k;if(!k)return;
  S[k]=e.target.type==='checkbox'?e.target.checked:typeof DEF[k]==='number'?+e.target.value:e.target.value.trim();save();apply()};
$('#settings').onclick=e=>{
  if(e.target.id==='clr')return clearLib(e.target);
  if(e.target.id==='place')placeOverlay();
  if(e.target.id==='reset'){S.ovX=S.ovY=null;save();pushOverlay();toast('Виджет вернётся вниз по центру')}};
function apply(){
  const b=document.body.classList;
  b.toggle('no-glow',!S.glow);b.toggle('no-anim',!S.anim);b.toggle('no-badge',!S.badges);b.toggle('wb',!!S.dockWave);
  if(!S.dyn){document.documentElement.style.removeProperty('--accent');document.documentElement.style.removeProperty('--onacc')}
  render();pushOverlay();drawWave();
}

/* ---------- виджет ---------- */
function pushOverlay(){
  emit('ov',{s:Object.fromEntries(Object.entries(S).filter(([k])=>k.startsWith('ov'))),title:now?now.title:'Ничего не играет',artist:now?now.artist:'',cover:now?cover(now):'',
    paused:audio.paused,t:audio.currentTime||0,d:audio.duration||0,vol:audio.volume,
    acc:document.documentElement.style.getPropertyValue('--accent')||'#8b7cf6'});
}
async function placeOverlay(){if(S.ovMin)await win.minimize();pushOverlay();emit('ov-place')}
['timeupdate','play','pause','volumechange'].forEach(v=>audio.addEventListener(v,pushOverlay));
listen('ov-ready',pushOverlay);
listen('ovcmd',async e=>{const {c,v,x,y}=e.payload;
  if(c==='pp')$('#pp').click();
  else if(c==='prev')step(-1);
  else if(c==='next')step(1);
  else if(c==='seek'&&audio.duration)audio.currentTime=v*audio.duration;
  else if(c==='vol')audio.volume=v;
  else if(c==='open'){await win.unminimize();await win.show();await win.setFocus()}
  else if(c==='placed'){S.ovX=x;S.ovY=y;save();await win.unminimize();await win.setFocus();toast('Положение сохранено')}
});

/* ---------- волна ---------- */
const peaks=new Map();let wp=null;
async function loadWave(tr){
  wp=null;drawWave();
  try{
    if(!peaks.has(tr.id)){
      const buf=await (await fetch(convertFileSrc(tr.file))).arrayBuffer();
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const a=await ctx.decodeAudioData(buf);ctx.close();
      const ch=a.getChannelData(0),N=160,step=Math.floor(ch.length/N),p=[];
      for(let i=0;i<N;i++){let m=0;for(let j=i*step;j<(i+1)*step;j+=16){const v=Math.abs(ch[j]);if(v>m)m=v}p.push(m)}
      const mx=Math.max(...p)||1;peaks.set(tr.id,p.map(v=>Math.pow(v/mx,.8)));
    }
    if(now&&now.id===tr.id){wp=peaks.get(tr.id);drawWave()}
  }catch{}
}
function drawOn(c){
  if(!c||!c.clientWidth)return;
  const d=devicePixelRatio,W=c.width=c.clientWidth*d,H=c.height=c.clientHeight*d,x=c.getContext('2d');
  const M=wp?wp.length:80,N=Math.max(24,Math.min(M,Math.floor(c.clientWidth/6))),bw=W/N,pr=audio.duration?audio.currentTime/audio.duration:0;
  const col=getComputedStyle(document.documentElement).getPropertyValue('--accent');
  for(let i=0;i<N;i++){
    const h=Math.max(4*d,(wp?Math.max(...wp.slice(Math.floor(i*M/N),Math.max(Math.floor(i*M/N)+1,Math.floor((i+1)*M/N)))):.12)*H);
    x.fillStyle=i/N<pr?col:'rgba(255,255,255,.26)';
    x.beginPath();x.roundRect(i*bw+bw*.18,(H-h)/2,bw*.64,h,bw*.32);x.fill();
  }
}
const drawWave=()=>{drawOn($('#wave'));drawOn($('#fwave'))};
const tick=()=>{drawWave();if(!audio.paused)requestAnimationFrame(tick)};
audio.addEventListener('play',tick);
addEventListener('resize',drawWave);
['#wave','#fwave'].forEach(s=>{
  const c=$(s);let dn=false;
  const go=e=>{const r=c.getBoundingClientRect();if(audio.duration)audio.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*audio.duration;drawWave()};
  c.onpointerdown=e=>{dn=true;c.setPointerCapture(e.pointerId);go(e)};
  c.onpointermove=e=>dn&&go(e);
  c.onpointerup=()=>dn=false;
});

/* ---------- «Сейчас играет» ---------- */
function glow(s){
  const el=$('#fs-img'),set=(t,b,l,r)=>[['t',t],['b',b],['l',l],['r',r]].forEach(([k,v])=>el.style.setProperty('--g'+k,v));
  if(!S.fsGlow||!s)return set('transparent','transparent','transparent','transparent');
  const a=[.3,.5,.75][S.fsGlowPower-1]||.5,i=new Image();i.crossOrigin='anonymous';
  i.onload=()=>{
    const N=24,c=document.createElement('canvas');c.width=c.height=N;
    const x=c.getContext('2d');x.drawImage(i,0,0,N,N);
    try{
      const avg=(x0,y0,w,h)=>{const d=x.getImageData(x0,y0,w,h).data,n=d.length/4;let r=0,g=0,b=0;
        for(let k=0;k<d.length;k+=4){r+=d[k];g+=d[k+1];b+=d[k+2]}
        r/=n;g/=n;b/=n;const m=Math.max(r,g,b)||1,f=m<110?110/m:1;
        return `rgba(${Math.min(255,r*f)|0},${Math.min(255,g*f)|0},${Math.min(255,b*f)|0},${a})`};
      set(avg(0,0,N,6),avg(0,N-6,N,6),avg(0,0,6,N),avg(N-6,0,6,N));
    }catch{const ac=`color-mix(in srgb,var(--accent) ${a*100}%,transparent)`;set(ac,ac,ac,ac)}
  };
  i.src=s;
}
function fsUpdate(){
  if(!now)return;
  const c=cover(now),i=queue.findIndex(t=>t.id===now.id);
  $('#fs-t').textContent=now.title;$('#fs-a').textContent=now.artist;
  $('#fs-chips').innerHTML=(SRC[now.source]?`<span class="pill">${SRC[now.source]}</span>`:'')+(isLocal(now)?`<span class="pill">${CHK} Скачан</span>`:'');
  const nx=i<0?[]:queue.slice(i+1,i+4).map((t,k)=>[t,i+1+k]);
  $('#fs-q').innerHTML=nx.length?'<div class="lab">Дальше</div>'+nx.map(([t,k])=>`<div class="qi" data-q="${k}"><div class="cv" style="--h:${hue(t.id)}">${img(t)}</div><div class="mt"><b>${esc(t.title)}</b><i>${esc(t.artist)}</i></div><span class="du">${t.duration?fmt(t.duration):''}</span></div>`).join(''):'';
  c?$('#fs-img').src=c:$('#fs-img').removeAttribute('src');
  $('#fs').style.setProperty('--fbg',c?`url("${c}")`:'none');glow(c);
}
$('#fs-q').onclick=e=>{const r=e.target.closest('[data-q]');if(r)play(queue[+r.dataset.q],queue)};
function openFs(){if(!now)return toast('Сначала включите трек');fsUpdate();$('#fs').hidden=false;drawWave();if(S.fsReal)win.setFullscreen(true)}
function closeFs(){if($('#fs').hidden)return;$('#fs').hidden=true;if(S.fsReal)win.setFullscreen(false)}
$('#npb').onclick=openFs;$('#fsb').onclick=openFs;$('#fs-x').onclick=closeFs;
$('#fs-pp').innerHTML=PLAY;
$('#fs-pp').onclick=()=>$('#pp').click();
$('#fs-prev').onclick=()=>step(-1);$('#fs-next').onclick=()=>step(1);
audio.addEventListener('play',()=>$('#fs-pp').innerHTML=PAUSE);
audio.addEventListener('pause',()=>$('#fs-pp').innerHTML=PLAY);
addEventListener('keydown',e=>{if(e.key==='Escape')closeFs()});

/* ---------- удаление и режимы повтора ---------- */
let ask=null,askT,clrAsk=false;
function stopPlayback(){
  audio.pause();audio.removeAttribute('src');audio.load();now=null;queue=[];qi=-1;wp=null;
  $('#np-t').textContent='Ничего не играет';$('#np-a').textContent='Выберите трек';$('#np-img').removeAttribute('src');
  $('#seek').value=0;setP($('#seek'),0);
  ['#cur','#dur','#fs-c','#fs-d'].forEach(s=>$(s).textContent='0:00');
  closeFs();drawWave();pushOverlay();
}
function askDel(id){
  if(ask===id){clearTimeout(askT);ask=null;return del(id)}
  ask=id;render();toast('Нажмите корзину ещё раз, чтобы удалить трек');
  clearTimeout(askT);askT=setTimeout(()=>{ask=null;render()},3000);
}
async function del(id){
  if(now&&now.id===id)stopPlayback();
  try{await invoke('delete_track',{id})}catch(e){return toast('Не удалось удалить: '+e)}
  lib=lib.filter(t=>t.id!==id);peaks.delete(id);
  queue=queue.filter(t=>t.id!==id);qi=now?queue.findIndex(t=>t.id===now.id):-1;
  toast('Трек удалён');render();
}
async function clearLib(b){
  if(!clrAsk){clrAsk=true;b.textContent='Нажмите ещё раз для удаления';setTimeout(()=>{clrAsk=false;if(view==='set')renderSet()},3500);return}
  clrAsk=false;stopPlayback();
  try{await invoke('clear_library')}catch(e){return toast(String(e))}
  lib=[];peaks.clear();toast('Библиотека очищена');render();
}
function syncModes(){
  ['#shuf','#fs-shuf'].forEach(s=>{$(s).classList.toggle('on',shuf);$(s).title=shuf?'Перемешивание включено':'Перемешать'});
  ['#rep','#fs-rep'].forEach(s=>{const e=$(s);e.classList.toggle('on',rep>0);e.classList.toggle('one',rep===2);e.title=['Повтор выключен','Повторять все треки','Повторять этот трек'][rep]});
}

invoke('library').then(l=>{lib=l;render()}).catch(()=>render());
apply();syncModes();
</script>
